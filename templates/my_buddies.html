<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Buddies</title>

<style>

body{
    background:#0b0018;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    background:#12002b;
    border-bottom:1px solid #2de2e6;
    color:#7cf7ff;
    font-size:18px;
}

.container{
    padding:20px;
    max-width:650px;
    margin:auto;
}

.section-title{
    margin-top:25px;
    margin-bottom:8px;
    font-size:15px;
    color:#7cf7ff;
    border-left:3px solid #2de2e6;
    padding-left:8px;
}

.count{
    font-size:13px;
    color:#aaa;
    margin-bottom:10px;
}

.card{
    background:#140030;
    border:1px solid #2de2e6;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    background:#1d0046;
}

.user-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #2de2e6;
    background:black;
}

.user-info{
    flex:1;
}

.user-name{
    font-weight:bold;
    font-size:15px;
}

.user-bio{
    color:#aaa;
    font-size:12px;
    margin-top:4px;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

</style>
</head>

<body>

<div class="header">
    👥 My Buddies
</div>

<div class="container">

    <div class="section-title">
        ADDED
    </div>

    <div id="following_count" class="count">
        Loading...
    </div>

    <div id="following_list"></div>

    <div class="section-title">
        BUDDIES
    </div>

    <div id="followers_count" class="count">
        Loading...
    </div>

    <div id="followers_list"></div>

</div>

<script>

function createCard(u){

    const dp =
        u.dp ||
        "/uploads/user_dp_pics/default_avatar.png";

    return `

        <div
            class="card"
            onclick="openProfile(${u.id})"
        >

            <div class="user-row">

                <img
                    class="avatar"
                    src="${dp}"
                    onerror="this.src='/uploads/user_dp_pics/default_avatar.png'"
                >

                <div class="user-info">

                    <div class="user-name">
                        ${u.name || "Unknown User"}
                    </div>

                    <div class="user-bio">
                        ${u.bio || ""}
                    </div>

                </div>

            </div>

        </div>

    `;
}

function loadFollowing(){

    fetch("/following")

    .then(r => r.json())

    .then(data => {

        document.getElementById(
            "following_count"
        ).innerText =
            data.count + " Added";

        const list =
            document.getElementById(
                "following_list"
            );

        if(!data.users || data.users.length === 0){

            list.innerHTML =
                '<div class="empty">No added users yet</div>';

            return;
        }

        list.innerHTML =
            data.users.map(createCard).join("");

    })

    .catch(err => {

        console.error(err);

    });

}

function loadFollowers(){

    fetch("/followers")

    .then(r => r.json())

    .then(data => {

        document.getElementById(
            "followers_count"
        ).innerText =
            data.count + " Buddies";

        const list =
            document.getElementById(
                "followers_list"
            );

        if(!data.users || data.users.length === 0){

            list.innerHTML =
                '<div class="empty">No buddies yet</div>';

            return;
        }

        list.innerHTML =
            data.users.map(createCard).join("");

    })

    .catch(err => {

        console.error(err);

    });

}

function openProfile(id){

    window.location.href =
        "/user/" + id;

}

loadFollowing();
loadFollowers();

</script>

</body>
</html>
