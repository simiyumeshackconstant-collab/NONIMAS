<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit</title>

    <style>

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#0b0018;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
            box-sizing:border-box;
        }

        .box{
            width:100%;
            max-width:420px;
            background:#140030;
            border:1px solid #2de2e6;
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 25px rgba(45,226,230,0.15);
        }

        h2{
            text-align:center;
            color:#7cf7ff;
            margin-top:0;
            margin-bottom:25px;
        }

        .balance{
            text-align:center;
            margin-bottom:25px;
            font-size:20px;
            background:#1b003d;
            padding:15px;
            border-radius:12px;
        }

        .balance b{
            color:#7cf7ff;
        }

        form{
            width:100%;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#1f0045;
            color:white;
            box-sizing:border-box;
            margin-bottom:15px;
            font-size:15px;
            outline:none;
        }

        input::placeholder{
            color:#aaa;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(45deg,#2de2e6,#7b2ff7);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-bottom:15px;
        }

        button:hover{
            opacity:0.95;
        }

        .notice{
            margin-top:10px;
            background:#220044;
            border:1px solid #ffcc00;
            color:#ffdd66;
            padding:15px;
            border-radius:12px;
            text-align:center;
            font-size:14px;
            line-height:1.5;
        }

        .back-btn{
            background:#1f0045;
            margin-top:15px;
        }

        .flash{
            background:#2b004d;
            color:#7cf7ff;
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

    </style>
</head>

<body>

<div class="box">

    <h2>Deposit Funds</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="balance">
        Balance: <b>${{ "%.2f"|format(wallet.balance) }}</b>
    </div>

    <form method="POST">

        <input
            type="number"
            name="amount"
            min="0.1"
            step="0.01"
            placeholder="Enter amount (USD)"
            required
        >

        <button type="submit">
            Deposit with Paystack
        </button>

    </form>

    <div class="notice">
        powered by Space Lio Ai.<br>
        
    </div>

    <button
        class="back-btn"
        onclick="location.href='/wallet_page'"
    >
        ← Back To Wallet
    </button>

</div>

</body>
</html>
