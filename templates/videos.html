<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Videos</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    display:flex;
    align-items:center;
    gap:10px;

    padding:15px;

    background:rgba(0,0,0,.8);

    z-index:1000;
}

.search{
    flex:1;

    padding:10px;

    border:none;

    border-radius:10px;

    background:#222;

    color:white;
}

.feed{
    margin-top:70px;
}
.upload-bar{
    margin-top:80px;
    padding:10px;
}

.upload-btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:#7b2ff7;

    color:white;

    font-size:16px;

    cursor:pointer;
}
.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.8);

    z-index:2000;
}

.modal-content{

    width:90%;
    max-width:500px;

    background:#111;

    padding:20px;

    border-radius:10px;

    margin:80px auto;

    color:white;
}

.modal textarea{

    width:100%;

    height:100px;

    background:#222;

    color:white;

    border:none;

    border-radius:10px;

    padding:10px;
}
</style>

</head>

<body>

<div class="header">

    <button onclick="history.back()">
        ←
    </button>

    <input
        class="search"
        placeholder="Search videos or #tags">
</div>
    

<div class="feed" id="feed">

</div>
<script>

function openUploadModal(){

    document.getElementById(
        "uploadModal"
    ).style.display="block";
}

function closeUploadModal(){

    document.getElementById(
        "uploadModal"
    ).style.display="none";
}

async function loadVideos(){

    const res = await fetch("/posts");

    const posts = await res.json();

    const videos = posts.filter(
        p => p.type === "video"
    );

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    if(videos.length === 0){

        feed.innerHTML =
            "<p style='text-align:center'>No videos found</p>";

        return;
    }

    videos.forEach(v=>{

        feed.innerHTML += `
            <div class="video-card">

                <video
                    src="${v.media}"
                    controls
                    width="100%">
                </video>

                <p>${v.content || ""}</p>

            </div>
        `;
    });
}
function searchVideos(keyword){

    keyword = keyword.toLowerCase();

    const filtered = allVideos.filter(v =>

        (v.content || "")
        .toLowerCase()
        .includes(keyword)
    );

    renderVideos(filtered);

    if(filtered.length === 0){

        feed.innerHTML =
            "<p style='text-align:center'>Nothing found</p>";
    }
}
loadVideos();
</script>
</body>
</html>
