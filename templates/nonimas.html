<!DOCTYPE html>
<html>
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nonimas</title>

<style>
body{
    background:#0b0018;
    color:white;
    font-family:Arial;
    margin:0;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:45px 20px 15px 20px;

    background:#12002b;
    border-bottom:1px solid #2de2e6;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{color:#7cf7ff;font-size:20px}

.top-btn{
    background:#1f0045;
    border:none;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    margin-left:10px;
    cursor:pointer;
}
.chat-btn{
    position:relative;
}

.badge{

    position:absolute;

    top:-5px;
    right:-5px;

    background:red;

    color:white;

    font-size:11px;

    min-width:18px;
    height:18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:2px;
}
.main{
    display:flex;
    width:100%;
}

/* Sidebar (left like Facebook) */
.sidebar{
    width:280px;
    padding:15px;
}

/* Feed should TAKE ALL REMAINING SPACE */

.feed-container{
    flex:1;

    padding:30px 15px 15px 15px;

    max-width:800px;
    margin:0 auto;
}

textarea{
    width:100%;
    background:#140030;
    border:1px solid #2de2e6;
    border-radius:10px;
    color:white;
    padding:10px;
    margin-bottom:10px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#2de2e6,#7b2ff7);
    color:white;
    cursor:pointer;
}
.media-btn{
    width:100%;
    padding:12px;
    margin-bottom:10px;

    border:none;
    border-radius:10px;

    background:#1f0045;
    color:white;

    font-size:15px;
    cursor:pointer;

    border:1px solid #2de2e6;
}
.post{
    background:#140030;
    border:1px solid #2de2e6;
    border-radius:14px;
    padding:18px;
    margin:15px 0;
    width:100%;
    box-sizing:border-box;
}
.actions{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    gap:10px;
}


.small-btn{
    flex:1;
    background:#1f0045;
    border:none;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}


.section-box{
    background:#140030;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    border:1px solid #2de2e6;
}

.comment-box{
    margin-top:10px;
    background:#0f0020;
    padding:10px;
    border-radius:10px;
}

.comment-input{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:1px solid #2de2e6;
    background:#140030;
    color:white;
    margin-top:5px;
}
.post-trigger{
    background:#140030;
    border:1px solid #2de2e6;
    padding:12px;
    border-radius:20px;
    color:#aaa;
    cursor:pointer;
    margin-bottom:15px;
}

.composer-modal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:500px;
    background:#140030;
    border:1px solid #2de2e6;
    border-radius:15px;
    padding:15px;
    z-index:10000;
    display:none;
}

.composer-modal textarea{
    width:100%;
    height:120px;
    background:#0f0020;
    border:none;
    color:white;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.composer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#7cf7ff;
    font-weight:bold;
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    z-index:9999;
}
</style>
</head>

<body>
<div id="composerModalBox" class="composer-modal">

    <div class="composer-header">
        <span>Create Post</span>
        <button onclick="closeComposer()">✕</button>
    </div>

    <textarea id="content" placeholder="Buddie, Wanna say something?"></textarea>

    <div class="composer-tools">

        <button class="media-btn" onclick="openMediaPicker()">
            📷 Photo / Video
        </button>


        <div id="selected-file"></div>

    </div>

    <button class="btn" onclick="createPost()">Post</button>

    <input type="file" id="file"
        accept=".png,.jpg,.jpeg,.webp,.gif,.mp4,.webm,.mov"
        style="display:none;">

</div>

<div id="overlay" class="overlay" onclick="attemptClose()"></div>

<div class="header">
    <span class="logo">Nonimas</span>
</div>
<div class="brand"> 
    <button class="top-btn" onclick="location.href='/buddies_page'">👤👤</button>
    <button class="top-btn" onclick="location.href='/wallet_page'">💰</button>
    <button class="top-btn" onclick="location.href='/chat_page'">💬<span id="chat-badge" class="badge" style="display:none;">0</span></button>
    <button class="top-btn" onclick="location.href='/videos_page'">🎬</button>   
    <button class="top-btn" onclick="location.href='/dp'">👤</button>
</div>
        
</div>

<div class="main">


<!-- FEED -->
<div class="feed-container">

    <div class="post-trigger" onclick="openComposer()">
        Buddie, Wanna say something?
    </div>
    <div id="feed"></div>

</div>

</div>

<script>

let user_id = {{ session.get('user_id', 0) | tojson }};
let draftSaved = "";

function openComposer(){
    document.getElementById("composerModalBox").style.display = "block";
    document.getElementById("overlay").style.display = "block";

    document.getElementById("content").value = draftSaved;
}

function closeComposer(){
    document.getElementById("composerModalBox").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}

function attemptClose(){

    let text = document.getElementById("content").value.trim();

    if(text.length > 0){

        let action = confirm("Discard post? OK = discard, Cancel = save draft");

        if(action){
            draftSaved = "";
        }else{
            draftSaved = text;
        }
    }

    closeComposer();
}
/* CREATE POST */

async function createPost(){

    let contentInput = document.getElementById("content");
    let fileInput = document.getElementById("file");

    let content = contentInput.value.trim();

    if(!content && fileInput.files.length === 0){
        return;
    }

    let fd = new FormData();

    fd.append("content", content);

    if(fileInput.files.length > 0){
        fd.append("file", fileInput.files[0]);
    }

    const tempId = "temp-" + Date.now();

    try{

        let previewMedia = "";

        if(fileInput.files.length > 0){

            const file = fileInput.files[0];

            const localURL = URL.createObjectURL(file);

            if(file.type.startsWith("image/")){

                previewMedia = `<img src="${localURL}" style="
                    width:100%;
                    border-radius:10px;
                    margin-top:10px;
                ">`;
            }

            else if(file.type.startsWith("video/")){

                previewMedia = `
                <video controls style="
                    width:100%;
                    border-radius:10px;
                    margin-top:10px;
                ">
                    <source src="${localURL}">
                </video>`;
            }
        }

        const feed = document.getElementById("feed");

        feed.innerHTML = `
        <div class="post" id="${tempId}" style="opacity:0.7">

            <p>${content}</p>

            ${previewMedia}

            <div style="margin-top:10px;color:#7cf7ff;">
                Posting...
            </div>

        </div>
        ` + feed.innerHTML;

        let res = await fetch("/create_post",{
            method:"POST",
            body:fd
        });

        let data = await res.json();

        // ✅ HANDLE ERRORS
        if(!res.ok || data.error){

            document.getElementById(tempId)?.remove();

            alert(data.error || "Post failed");

            return;
        }

        // ✅ SUCCESS
        contentInput.value = "";
        fileInput.value = "";

        document.getElementById("selected-file").innerHTML = "";
        document.getElementById(tempId)?.remove();

        setTimeout(()=>{
            loadPosts();
        },500);
        

    }catch(err){

        console.error(err);

        document.getElementById(tempId)?.remove();

        alert("Error could not be posted");
    }
}

function openMediaPicker(){
    document.getElementById("file").click();
}
document.getElementById("file").addEventListener("change", function(){

    let file = this.files[0];

    if(file){
        document.getElementById("selected-file").innerHTML =
            "Selected: " + file.name;
    }
});
/* LIKE POST */
function likePost(postId){
    fetch("/like_post",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({post_id:postId})
    })
    .then(r=>r.json())
    .then(data=>{
        const btn = document.querySelector(`#like-btn-${postId}`);

        if(btn){
            btn.innerHTML = `❤️ ${data.count}`;
        }
    });
}

/* LOAD COMMENTS */
function loadComments(postId){

    let box = document.getElementById(`comments-${postId}`);

    fetch(`/comments/${postId}`)
    .then(r=>r.json())
    .then(data=>{

        box.innerHTML = "";

        data.forEach(c=>{
            box.innerHTML += `
                <div class="section-box">
                    <b>${c.name}</b><br>
                    ${c.comment}
                </div>
            `;
        });

        box.innerHTML += `
            <input class="comment-input" id="input-${postId}" placeholder="Write comment...">
            <button class="small-btn" onclick="addComment(${postId})">Send</button>
        `;
    });
}

/* ADD COMMENT */
function addComment(postId){

    let text = document.getElementById(`input-${postId}`).value;

    fetch("/add_comment",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            post_id:postId,
            comment:text
        })
    })
    .then(r=>r.json())
    .then(data=>{

        const btn = document.querySelector(`#comment-btn-${postId}`);

        if(btn){
            btn.innerHTML = `💬 ${data.count}`;
        }

        loadComments(postId);
    });
}
/* 🎁 GIFT COUNT HELPER */
async function getGiftCount(postId){
    let res = await fetch(`/gift_count/${postId}`);
    let data = await res.json();
    return data.count;
}
/* POSTS */
async function loadPosts(){

    let res = await fetch("/posts");
    let data = await res.json();

    let feed = document.getElementById("feed");
    feed.innerHTML = "";

    for (let p of data){

        let media = "";

        if(p.media){

            if(p.type === "image"){
                media = `
                <img src="${p.media}" style="
                    width:100%;
                    max-height:500px;
                    object-fit:cover;
                    border-radius:10px;
                    margin-top:10px;
                ">`;
            }

            else if(p.type === "video"){
                media = `
                <video controls style="
                    width:100%;
                    border-radius:10px;
                    margin-top:10px;
                ">
                    <source src="${p.media}">
                </video>`;
            }

            else{
                media = `
                <a href="${p.media}" target="_blank">
                    Download File
                </a>`;
            }
        }

        // 🎁 GET TOTAL GIFTS
        let giftCount = await getGiftCount(p.id);

        feed.innerHTML += `
        <div class="post">
            <p>${p.content}</p>
            ${media}

            <div class="actions">

                <button
                    id="like-btn-${p.id}"
                    class="small-btn"
                    onclick="likePost(${p.id})">
                    ❤️ ${p.likes}
                </button>

                <button id="comment-btn-${p.id}"
                    class="small-btn"
                    onclick="loadComments(${p.id})">
                    💬 ${p.comments}
                </button>

                <button id="gift-btn-${p.id}"
                    data-count="${giftCount}"
                    class="small-btn"
                    onclick="toggleGiftBox(${p.id},${p.user})">
                    🎁 ${giftCount}
                </button>

            </div>

            <div id="gift-box-${p.id}" style="display:none;margin-top:10px;"></div>

            <div id="comments-${p.id}" class="comment-box"></div>
        </div>`;
    }
}

/* GIFT BOX */
function toggleGiftBox(postId, receiverId){

    let box = document.getElementById(`gift-box-${postId}`);

    if(box.style.display==="block"){
        box.style.display="none";
        return;
    }

    box.style.display="block";
    box.innerHTML="Loading...";

    fetch("/gifts")
    .then(r=>r.json())
    .then(gifts=>{
        box.innerHTML="";

        gifts.forEach(g=>{
            box.innerHTML += `
                <div class="section-box">
                    <b>${g.name}</b>
                    <button class="small-btn" onclick="sendGift(${postId},${receiverId},${g.id})">
                        Send
                    </button>
                </div>
            `;
        });
    });
}

/* SEND GIFT */
function sendGift(postId, receiverId, giftId){

    fetch("/check_gift_access",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({gift_id:giftId})
    })
    .then(r => r.json())
    .then(res => {

        // ❌ NOT ALLOWED → REDIRECT TO BUY PAGE
        if(!res.allowed){
            alert("You don't have gifts. Redirecting to shop...");

            window.location.href = res.redirect || "/buy_gift_page";
            return;
        }

        // ✅ SEND GIFT
        return fetch("/send_gift",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                post_id:postId,
                gift_id:giftId,
                quantity:1
            })
        });

    })
    .then(r => {
        if (!r) return; // stop if redirected earlier
        return r.json();
    })
    .then(data => {

        if (!data) return;

        // ⚠️ SERVER REDIRECT (important fix)
        if (data.redirect){
            window.location.href = data.redirect;
            return;
        }

        if (data.error){
            alert(data.error);
            return;
        }

        // ✅ success
        const giftBtn = document.querySelector(`#gift-btn-${postId}`);

        if(giftBtn){

            let current = parseInt(
                giftBtn.dataset.count || "0"
            );

            current++;

            giftBtn.dataset.count = current;

            giftBtn.innerHTML = `🎁 ${current}`;
    }
    })
    .catch(err => {
        console.error("Gift error:", err);
    });
}
/* LIVE CHAT COUNT */

function loadUnreadMessages(){

    fetch("/unread_counts")
    .then(r=>r.json())
    .then(data=>{

        let badge = document.getElementById("chat-badge");

        if(data.total > 0){

            badge.style.display = "flex";

            badge.innerText = data.total;

        }else{

            badge.style.display = "none";
        }

    });

}

/* refresh every 3 sec */
setInterval(loadUnreadMessages,3000);

loadUnreadMessages();

/* INITIAL LOAD */
loadPosts();
</script>
</body>

                <div style="color:#ccc;font-size:12px;">

</div>

<style>

</style>

<script>

function isInstalledApp() {

    const ua = navigator.userAgent || "";

    // Strong indicators of WebView / APK
    const isWebView =
        ua.includes("wv") ||
        ua.includes("Version/") && ua.includes("Chrome") ||
        window.ReactNativeWebView;

    // Optional: manual flag (BEST PRACTICE)
    const forcedAppMode = localStorage.getItem("nonimas_app") === "true";

    return isWebView || forcedAppMode;
}
function showInstallCard(){

    // 🚫 NEVER SHOW INSIDE APK
    if(isAndroidWebView()){
        return;
    }

    const hidden = localStorage.getItem("nonimas_install_hidden");

    if(hidden === "yes"){
        return;
    }

    document.getElementById("install-card").style.display = "block";

    document.body.classList.add("banner-visible");
}

function hideInstallCard(){

    document.getElementById("install-card").style.display = "none";

    document.body.classList.remove("banner-visible");

    localStorage.setItem("nonimas_install_hidden", "yes");
}

window.addEventListener("load", ()=>{

    setTimeout(()=>{

        showInstallCard();

    },1000);

});
</script>
