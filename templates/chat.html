<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chats</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111b21;
    color:white;
}

.header{
    background:#202c33;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.search-box{
    padding:10px;
    background:#111b21;
}

#search{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2a3942;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

.user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid #233138;
    cursor:pointer;
}

.user:hover{
    background:#2a3942;
}

.user img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
    margin-bottom:4px;
}

.bio{
    color:#aaa;
    font-size:13px;
}

.badge{
    background:#00a884;
    color:white;
    min-width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">
Chats
</div>

<div class="search-box">
<input id="search" placeholder="Search">
</div>

<div id="users"></div>

<script>

function avatar(dp){
    if(!dp || dp=="None" || dp=="null"){
        dp="default_avatar.png";
    }
    return "/uploads/user_dp_pics/" + dp;
}

async function loadUsers(){

    const usersRes = await fetch("/following");
    const usersData = await usersRes.json();

    const unreadRes = await fetch("/unread_counts");
    const unreadData = await unreadRes.json();

    const box=document.getElementById("users");
    box.innerHTML="";

    usersData.users.forEach(user=>{

        const count=unreadData.users[String(user.id)] || 0;

        const div=document.createElement("div");
        div.className="user";

        div.onclick=function(){
            window.location="/chat/" + user.id;
        };

        div.innerHTML=`
            <img src="${avatar(user.dp)}"
            onerror="this.src='/uploads/user_dp_pics/default_avatar.png'">

            <div class="info">
                <div class="name">${user.name}</div>
                <div class="bio">${user.bio || "Tap to chat"}</div>
            </div>

            ${count ? `<div class="badge">${count}</div>` : ""}
        `;

        box.appendChild(div);

    });

}

document.getElementById("search").addEventListener("input",function(){

    const value=this.value.toLowerCase();

    document.querySelectorAll(".user").forEach(u=>{
        u.style.display=
        u.innerText.toLowerCase().includes(value)
        ? "flex"
        : "none";
    });

});

loadUsers();
setInterval(loadUsers,10000);

</script>

</body>
</html>
