<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chats</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111b21;
    color:white;
}

.header{
    background:#202c33;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.search-box{
    padding:10px;
    background:#111b21;
}

#search{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2a3942;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

.user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid #233138;
    cursor:pointer;
}

.user:hover{
    background:#2a3942;
}

.user img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
    margin-bottom:4px;
}

.bio{
    color:#aaa;
    font-size:13px;
}
.badge-container{
    display:flex;
    align-items:center;
    gap:6px;
}
.badge{
    background:#00a884;
    color:white;
    min-width:15px;
    height:12px;
    border-radius:25%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:8px;
}
</style>
</head>

<body>

<div class="header">
Chats
</div>

<div class="search-box">
<input id="search" placeholder="Search">
</div>

<div id="users"></div>

<script>
let pressTimer;
function avatar(dp){
    return dp && dp !== "None" && dp !== "null"
        ? dp
        : "/uploads/user_dp_pics/default_avatar.png";
}

async function loadUsers(){

    const usersRes = await fetch("/following");
    const usersData = await usersRes.json();

    const unreadRes = await fetch("/unread_counts");
    const unreadData = await unreadRes.json();

    const box=document.getElementById("users");
    box.innerHTML="";

    usersData.users.forEach(user=>{

        const count=unreadData.users[String(user.id)] || 0;

        const div=document.createElement("div");
        div.className="user";

        div.onclick=function(){
            window.location="/chat/" + user.id;
        };
        div.addEventListener("touchstart",function(){
            pressTimer=setTimeout(()=>{
                if(confirm(
                    `Delete conversation with ${user.name} for both users?`
                )){
                    clearconversation(user.id);
                }
            },800);
        });
        div.addEventListener("touchend",function(){
            clearTimeout(pressTimer);
        });

        div.addEventListener("touchmove",function(){
            clearTimeout(pressTimer);
        });

        div.addEventListener("mousedown",function(){

            pressTimer=setTimeout(()=>{

                if(confirm(
                    `Delete conversation with ${user.name} for both users?`
                )){
                    clearConversation(user.id);
                }

            },800);

        });

        div.addEventListener("mouseup",function(){
            clearTimeout(pressTimer);
        });

        div.addEventListener("mouseleave",function(){
            clearTimeout(pressTimer);
        });
            

        div.innerHTML=`
            <img src="${avatar(user.dp)}"
            onerror="this.src='/uploads/user_dp_pics/default_avatar.png'">

            <div class="info">
                <div class="name">${user.name}</div>
                <div class="bio">
                    ${user.bio ||""}
                </div>
                <div style="font-size:12px;color:${user.is_online ? '#00ff88' : '#888'};">
                    ${user.is_online ? '● Online' : 'Offline'}
            </div>

            <div class="badge-container">
                ${count ? `<div class="badge">${count}</div>` : ""}
            </div>
        `;

        box.appendChild(div);

    });

}
function clearConversation(otherUser){

    fetch("/clear_chat_both",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            other_user:otherUser
        })
    })
    .then(r=>r.json())
    .then(data=>{

        if(data.success){
            alert("Conversation deleted");
            loadUsers();
        }else{
            alert(data.error || "Could not delete");
        }

    });

}

document.getElementById("search").addEventListener("input",function(){

    const value=this.value.toLowerCase();

    document.querySelectorAll(".user").forEach(u=>{
        u.style.display=
        u.innerText.toLowerCase().includes(value)
        ? "flex"
        : "none";
    });

});

loadUsers();
setInterval(loadUsers,10000);

</script>

</body>
</html>
