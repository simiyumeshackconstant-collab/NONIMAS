<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Conversation</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

html,
body{
    height:100%;
    margin:0;
    font-family:Arial,sans-serif;
    background:#111b21;
    color:white;
}


body{
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:60px;
    min-height:60px;
    background:#202c33;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-sizing:border-box;
    flex-shrink:0;
}

.back{
    text-decoration:none;
    color:white;
    font-size:24px;
    margin-right:15px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.msg{
    max-width:80%;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
    word-wrap:break-word;
}

.me{
    background:#005c4b;
    margin-left:auto;
}

.other{
    background:#202c33;
}

.time{
    font-size:11px;
    opacity:.7;
    margin-top:5px;
}

/* INPUT BAR */
.inputbar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    background:#202c33;
    border-top:1px solid #2f3b42;
}
.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
    padding-bottom:90px;
    box-sizing:border-box;
}

#message{
    flex:1;
    border:none;
    outline:none;
    border-radius:8px;
    padding:12px;
    font-size:16px;
    background:#2a3942;
    color:white;
}

button{
    width:50px;
    height:48px;
    border:none;
    border-radius:8px;
    background:#00a884;
    color:white;
    font-size:18px;
    cursor:pointer;
}
.file-btn{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2a3942;
    border-radius:8px;
    cursor:pointer;
    font-size:22px;
    color:white;
}

.inputbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    background:#202c33;
    border-top:1px solid #2f3b42;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
    box-sizing:border-box;
    margin-bottom:70px;
}
</style>
</head>

<body>

<div class="header">

<a class="back" href="/chat_page">←</a>

<img
class="avatar"
src="{{ other_user.user_dp_pic or url_for('static', filename='icons/default_avatar.png') }}"
onerror="this.src='/uploads/user_dp_pics/default_avatar.png'">

<div style="display:flex;flex-direction:column;">
    <div class="name">
        {{ other_user.full_name }}
    </div>

    <div
        id="typingStatus"
        style="
        font-size:12px;
        color:#25D366;
        display:none;
        ">
        Typing...
    </div>
</div>

</div> <!-- END HEADER -->

<div id="messages" class="messages"></div>

<div class="inputbar">

    <label for="chatFile" class="file-btn">
        📎
    </label>

    <input
        type="file"
        id="chatFile"
        accept=".pdf,.doc,.docx,image/*,video/*"
        hidden>

    <input
        id="message"
        class="chat-input"
        placeholder="Type a message">

    <button onclick="sendMessage()">➤</button>

</div>
<script>
let typingTimer;
let pressTimer;
const socket = io();
socket.emit("join");
document
.getElementById("message")
.addEventListener("input",function(){

    socket.emit("typing",{
        receiver:otherUser
    });

    clearTimeout(typingTimer);

    typingTimer=setTimeout(()=>{

        socket.emit("stop_typing",{
            receiver:otherUser
        });

    },1000);

});
socket.on("stop_typing",data=>{

    if(data.user==otherUser){

        document
        .getElementById("typingStatus")
        .style.display="none";

    }

});
socket.on("typing",data=>{

    if(data.user==otherUser){

        document
        .getElementById("typingStatus")
        .style.display="block";

    }

});
const currentUser = Number("{{ session.get('user_id') }}");
const otherUser = Number("{{ other_user.id }}");

socket.on("new_message", data => {

    if(
        data.sender == otherUser ||
        data.receiver == otherUser
    ){
        loadMessages();
    }

});
async function sendMessage(){

    const input =
    document.getElementById("message");

    const fileInput =
    document.getElementById("chatFile");

    const formData =
    new FormData();

    formData.append(
        "receiver_id",
        otherUser
    );

    formData.append(
        "message",
        input.value.trim()
    );

    if(fileInput &&
       fileInput.files.length){

        formData.append(
            "file",
            fileInput.files[0]
        );

    }

    try{

        const res =
        await fetch(
            "/send_message",
            {
                method:"POST",
                body:formData
            }
        );

        const data =
        await res.json();

        console.log(data);

        if(!data.success){

            alert(
                data.error ||
                "Send failed"
            );

            return;
        }

        input.value="";

        if(fileInput){
            fileInput.value="";
        }

        loadMessages();

    }catch(err){

        console.error(err);

        alert(
            "Network error"
        );

    }

}
async function loadMessages(){

    try{

        const res = await fetch(
            "/get_messages/" + otherUser
        );

        const data = await res.json();

        const box =
        document.getElementById("messages");

        box.innerHTML = "";

        data.forEach(msg => {

            const mine =
            Number(msg.sender) === currentUser;

            const div =
            document.createElement("div");

            div.className =
            "msg " +
            (mine ? "me" : "other");

            let mediaHtml = "";

            if(msg.media_url){

                if(msg.media_type === "image"){

                    mediaHtml = `
                        <img
                            src="${msg.media_url}"
                            style="
                                max-width:250px;
                                width:100%;
                                border-radius:8px;
                                margin-bottom:5px;
                            ">
                    `;

                }
                else if(msg.media_type === "video"){

                    mediaHtml = `
                        <video
                            controls
                            style="
                                max-width:250px;
                                width:100%;
                                border-radius:8px;
                                margin-bottom:5px;
                            ">
                            <source src="${msg.media_url}">
                        </video>
                    `;

                }
                else if(msg.media_type === "pdf"){

                    mediaHtml = `
                        <a
                            href="${msg.media_url}"
                            target="_blank"
                            style="color:#25D366;">
                            📄 Open PDF
                        </a>
                    `;

                }
                else if(msg.media_type === "doc"){

                    mediaHtml = `
                        <a
                            href="${msg.media_url}"
                            target="_blank"
                            style="color:#25D366;">
                            📄 Open Document
                        </a>
                    `;

                }

            }

            div.innerHTML = `
                ${mediaHtml}
                ${msg.message ? `<div>${msg.message}</div>` : ""}
                <div class="time">
                    ${msg.created_at}
                </div>
            `;

            if(mine){

                div.addEventListener("touchstart",()=>{

                    pressTimer = setTimeout(()=>{

                        if(confirm(
                            "Delete this message?"
                        )){
                            deleteMessage(msg.id);
                        }

                    },800);

                });

                div.addEventListener(
                    "touchend",
                    ()=>clearTimeout(pressTimer)
                );

                div.addEventListener(
                    "touchmove",
                    ()=>clearTimeout(pressTimer)
                );

                div.addEventListener("mousedown",()=>{

                    pressTimer = setTimeout(()=>{

                        if(confirm(
                            "Delete this message?"
                        )){
                            deleteMessage(msg.id);
                        }

                    },800);

                });

                div.addEventListener(
                    "mouseup",
                    ()=>clearTimeout(pressTimer)
                );

                div.addEventListener(
                    "mouseleave",
                    ()=>clearTimeout(pressTimer)
                );

            }

            box.appendChild(div);

        });

        box.scrollTop =
        box.scrollHeight;

    }catch(err){

        console.error(
            "Load messages error:",
            err
        );

    }

}
async function deleteMessage(messageId){

    const res = await fetch(
        "/delete_message",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message_id:messageId
            })
        }
    );

    const data = await res.json();

    if(data.success){

        loadMessages();

    }else{

        alert(
            data.error ||
            "Could not delete message"
        );

    }

}
document
.getElementById("message")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

loadMessages();

</script>

</body>
</html>
