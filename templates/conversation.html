<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Conversation</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

html,
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111b21;
    color:white;
}


body{
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:60px;
    min-height:60px;
    background:#202c33;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-sizing:border-box;
    flex-shrink:0;
}

.back{
    text-decoration:none;
    color:white;
    font-size:24px;
    margin-right:15px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    margin-right:10px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
    box-sizing:border-box;
}

.msg{
    max-width:80%;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
    word-wrap:break-word;
}

.me{
    background:#005c4b;
    margin-left:auto;
}

.other{
    background:#202c33;
}

.time{
    font-size:11px;
    opacity:.7;
    margin-top:5px;
}

/* INPUT BAR */

.inputbar{
    min-height:60px;
    background:#202c33;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    box-sizing:border-box;
    border-top:1px solid #2f3b42;
    flex-shrink:0;
}

#message{
    flex:1;
    border:none;
    outline:none;
    border-radius:8px;
    padding:10px;
    font-size:16px;
    background:#2a3942;
    color:white;
}

button{
    width:48px;
    height:44px;
    border:none;
    border-radius:8px;
    background:#00a884;
    color:white;
    font-size:18px;
    flex-shrink:0;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="header">

<a class="back" href="/chat_page">←</a>

<img
class="avatar"
src="/uploads/user_dp_pics/{{ other_user.user_dp_pic or 'default_avatar.png' }}"
onerror="this.src='/uploads/user_dp_pics/default_avatar.png'">

<div class="name">
{{ other_user.full_name }}
</div>

</div>

<div id="messages" class="messages">
</div>

<div class="inputbar">

<input
id="message"
placeholder="Type a message">

<button onclick="sendMessage()">
➤
</button>

</div>

<script>

const currentUser = Number("{{ session.get('user_id') }}");
const otherUser = Number("{{ other_user.id }}");

const socket = io();

socket.emit("join");

socket.on("new_message", data => {

    if(
        data.sender == otherUser ||
        data.receiver == otherUser
    ){
        loadMessages();
    }

});

async function loadMessages(){

    const res = await fetch(
        "/get_messages/" + otherUser
    );

    const data = await res.json();

    const box = document.getElementById("messages");

    box.innerHTML = "";

    data.forEach(msg => {

        const mine =
        msg.sender == currentUser;

        const div =
        document.createElement("div");

        div.className =
        "msg " +
        (mine ? "me" : "other");

        div.innerHTML = `
        <div>${msg.message}</div>
        <div class="time">
        ${msg.created_at}
        </div>
        `;

        box.appendChild(div);

    });

    box.scrollTop = box.scrollHeight;

}

async function sendMessage(){

    const input =
    document.getElementById("message");

    const text =
    input.value.trim();

    if(!text) return;

    await fetch(
        "/send_message",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                receiver_id:otherUser,
                message:text
            })
        }
    );

    input.value = "";

    loadMessages();

}

document
.getElementById("message")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

loadMessages();

</script>

</body>
</html
